# Traefik Helm Values for kOps on AWS
# Traefik manages Let's Encrypt certificates for applications.
# ArgoCD is the exception: its TCP route passes TLS through to ArgoCD.

# --- Persistent storage for ACME certificates ---
persistence:
  enabled: true
  size: 128Mi
  path: /data

# --- Let's Encrypt ACME configuration ---
additionalArguments:
  - "--certificatesresolvers.letsencrypt.acme.email=CHANGE_ME@example.com"
  - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
  - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

# --- Entrypoints ---
ports:
  web:
    port: 8000
    exposedPort: 80
    protocol: TCP
    # New syntax for HTTP to HTTPS redirection
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443
    protocol: TCP
    http:
      tls:
        certResolver: letsencrypt

# --- Service (AWS NLB) ---
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

# --- Deployment ---
deployment:
  replicas: 1

# --- Logs ---
logs:
  general:
    level: INFO
  access:
    enabled: true
